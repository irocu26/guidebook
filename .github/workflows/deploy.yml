name: Deploy Survival Guide to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Prepare Docs Structure
        run: |
          mkdir -p docs
          cp README.md docs/index.md
          cp -r 01-Simulation-First 02-Software-Architecture 03-The-GPS-Denied-Transition 04-Hardware-and-Reality-Checks 05-Debugging docs/

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
