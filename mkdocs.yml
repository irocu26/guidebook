site_name: "IRoC-U Technical Survival Guide"
site_description: "An unfiltered engineering guide for GPS-denied drones using ArduPilot, ROS 2, and Companion Computers."
site_author: "Senior Team"
docs_dir: "."

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: "Switch to light mode"
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: "Switch to dark mode"
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy

plugins:
  - search

nav:
  - "The Mindset": README.md
  - "01 - Simulation First": 01-Simulation-First/01-sitl-and-gazebo.md
  - "02 - Software Architecture": 02-Software-Architecture/01-ros2-vs-pymavlink.md
  - "03 - GPS-Denied: Optical Flow": 03-The-GPS-Denied-Transition/01-optical-flow-and-rangefinder.md
  - "03 - GPS-Denied: Visual SLAM & TF": 03-The-GPS-Denied-Transition/02-orbslam3-and-tf.md
  - "04 - Hardware Fails & Reality Checks": 04-Hardware-and-Reality-Checks/01-hardware-fails.md
  - "05 - Debugging & Logs": 05-Debugging/01-reading-the-matrix-logs.md
